# Apache Web服务器防连接耗尽攻击配置
# 请将此文件包含在你的Apache配置中

# 限制每个IP的并发连接数
<IfModule mod_limitipconn.c>
    MaxConnPerIP 5
    NoIPLimit image/*
</IfModule>

# 限制请求频率
<IfModule mod_evasive24.c>
    DOSHashTableSize    3097
    DOSPageCount        2
    DOSSiteCount        50
    DOSPageInterval     1
    DOSSiteInterval     1
    DOSBlockingPeriod   10
</IfModule>

# 请求超时设置
TimeOut 30
KeepAlive On
MaxKeepAliveRequests 100
KeepAliveTimeout 5

# 限制请求大小
LimitRequestBody 10485760
LimitRequestFields 100
LimitRequestFieldSize 8190
LimitRequestLine 8190

# MPM配置 - 如果使用mpm_event或mpm_prefork
<IfModule mpm_event_module>
    StartServers             2
    MinSpareThreads         25
    MaxSpareThreads         75
    ThreadLimit             64
    ThreadsPerChild         25
    MaxRequestWorkers      150
    MaxConnectionsPerChild  1000
</IfModule>

<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          5
    MaxSpareServers         10
    MaxRequestWorkers      150
    MaxConnectionsPerChild  1000
</IfModule>

# 防护缓慢HTTP攻击
<IfModule reqtimeout_module>
    RequestReadTimeout header=10-20,MinRate=500 body=20,MinRate=500
</IfModule>
